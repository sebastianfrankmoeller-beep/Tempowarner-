name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Schreibrecht, damit der Workflow Releases mit der APK anlegen darf
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle wird direkt installiert, ein Gradle-Wrapper im Repo ist nicht nötig.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK bauen
        run: gradle assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Tempowarner.apk

      - name: APK als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Tempowarner-APK
          path: Tempowarner.apk
          if-no-files-found: error

      # Direkter Download: jede Version als Release, der Link
      # .../releases/latest/download/Tempowarner.apk zeigt immer auf die neueste.
      - name: Release mit direktem Download-Link
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          printf '%s\n' "${COMMIT_MSG:-Manueller Build}" > notes.md
          gh release create "v$VERSION" Tempowarner.apk \
            --title "Tempowarner $VERSION" \
            --notes-file notes.md \
            --latest
